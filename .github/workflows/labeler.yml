name: "Pull Request Labeler"
on:
- pull_request_target

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@v5
    
    - uses: codelytv/pr-size-labeler@v1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        xs_label: 'size/S'
        xs_max_size: '10'
        s_label: 'size/M'
        s_max_size: '100'
        m_label: 'size/L'
        m_max_size: '500'
        l_label: 'size/XL'
        # The shared helper below owns the warning and skips unchanged comments.
        message_if_xl: ''

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false
        sparse-checkout: .github/scripts/ci

    - name: Warn about large PRs
      uses: actions/github-script@v7
      with:
        script: |
          const { notifySize } = require('./.github/scripts/ci/notifications.js');
          await notifySize(github, context);

name: YCSB Scenario

on:
  workflow_run:
    workflows: ["Docker Test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional environment image tag. Defaults to latest for manual runs."
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write
  packages: read

concurrency:
  group: ycsb-scenario-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  ycsb-scenario:
    name: Run YCSB scenario matrix
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request_target')
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}/recstore-devel
      TEST_CONTAINER: recstore-ycsb-${{ github.run_id }}-${{ github.run_attempt }}
      OUTPUT_DIR: /tmp/recstore_ycsb_ci
      YCSB_RECORD_COUNT: "100000"
      YCSB_OPERATION_COUNT: "100000"
      YCSB_HYBRIDKV_SHM_CAPACITY: "268435456"
      YCSB_HYBRIDKV_SSD_CAPACITY: "1073741824"
      PUBLISH_YCSB: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          submodules: false
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve image reference
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag || '' }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo_lower="$(echo "${IMAGE_REPO}" | tr '[:upper:]' '[:lower:]')"
          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            tag="${INPUT_IMAGE_TAG}"
          elif [ "${EVENT_NAME}" = "workflow_run" ] && [ -n "${WORKFLOW_RUN_HEAD_SHA}" ]; then
            tag="sha-$(echo "${WORKFLOW_RUN_HEAD_SHA}" | cut -c1-7)"
          else
            tag="sha-$(echo "${CURRENT_SHA}" | cut -c1-7)"
          fi
          echo "repo=${repo_lower}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull docker image
        id: pull
        run: |
          set -euo pipefail
          repo="${{ steps.image.outputs.repo }}"
          primary="${{ steps.image.outputs.tag }}"
          for tag in "${primary}" latest manual; do
            image="${repo}:${tag}"
            echo "Trying image: ${image}"
            if docker pull "${image}" 2>/dev/null; then
              echo "pulled_image=${image}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "Failed to pull a usable RecStore development image." >&2
          exit 1

      - name: Log host disk usage after image pull
        run: |
          set -euo pipefail
          echo "Host disk usage after image pull:"
          df -h "${GITHUB_WORKSPACE}" /tmp
          echo "Docker disk usage after image pull:"
          docker system df

      - name: Start YCSB container
        env:
          TEST_IMAGE: ${{ steps.pull.outputs.pulled_image }}
        run: |
          set -euo pipefail
          docker run -d --name "${TEST_CONTAINER}" --network host \
            --security-opt seccomp=unconfined \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${TEST_IMAGE}" \
            bash -lc 'tail -f /dev/null'

      - name: Restore initialized third_party cache
        run: |
          set -euo pipefail
          docker exec "${TEST_CONTAINER}" bash -lc '
            set -euo pipefail
            cache_dir="/opt/recstore-cache/third_party"
            if [ -d "${cache_dir}" ]; then
              rm -rf /workspace/third_party
              mv "${cache_dir}" /workspace/third_party
            fi
            echo "Container disk usage after third_party restore:"
            df -h / /workspace /tmp
            echo "Restored third_party size:"
            du -sh /workspace/third_party 2>/dev/null || true
          '

      - name: Install YCSB scenario dependencies
        run: |
          set -euo pipefail
          docker exec "${TEST_CONTAINER}" bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              librocksdb-dev \
              libleveldb-dev \
              libbz2-dev \
              libsqlite3-dev
            rm -rf /var/lib/apt/lists/*
          '

      - name: Build YCSB target
        run: |
          set -euo pipefail
          docker exec "${TEST_CONTAINER}" bash -lc '
            set -euo pipefail
            cd /workspace
            rm -rf build_ycsb_recstore build_ycsb_external
            cmake -S . -B build_ycsb_recstore \
              -DENABLE_CUDA=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DRECSTORE_BUILD_BENCHMARKS=OFF \
              -DRECSTORE_BUILD_TESTS=OFF \
              -DRECSTORE_BUILD_FRAMEWORK=OFF \
              -DRECSTORE_BUILD_UVM_EXECUTABLES=OFF \
              -DRECSTORE_BUILD_GRPC_PS=OFF \
              -DRECSTORE_BUILD_BRPC_PS=OFF \
              -DRECSTORE_BUILD_RDMA_PS=OFF \
              -DRECSTORE_BUILD_LOCAL_SHM_PS=OFF \
              -DBIND_RECSTORE=ON \
              -DBIND_ROCKSDB=OFF \
              -DBIND_LEVELDB=OFF \
              -DBIND_SQLITE=OFF \
              -DBIND_LMDB=OFF \
              -DBIND_WIREDTIGER=OFF
            cmake --build build_ycsb_recstore --target ycsb -j2
            cmake -S . -B build_ycsb_external \
              -DENABLE_CUDA=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DRECSTORE_BUILD_BENCHMARKS=OFF \
              -DRECSTORE_BUILD_TESTS=OFF \
              -DRECSTORE_BUILD_FRAMEWORK=OFF \
              -DRECSTORE_BUILD_UVM_EXECUTABLES=OFF \
              -DRECSTORE_BUILD_GRPC_PS=OFF \
              -DRECSTORE_BUILD_BRPC_PS=OFF \
              -DRECSTORE_BUILD_RDMA_PS=OFF \
              -DRECSTORE_BUILD_LOCAL_SHM_PS=OFF \
              -DBIND_RECSTORE=OFF \
              -DBIND_ROCKSDB=ON \
              -DBIND_LEVELDB=ON \
              -DBIND_SQLITE=ON \
              -DBIND_LMDB=OFF \
              -DBIND_WIREDTIGER=OFF \
              -DWITH_BZ2=OFF \
              -DWITH_SNAPPY=OFF \
              -DWITH_LZ4=OFF \
              -DWITH_ZSTD=OFF
            cmake --build build_ycsb_external --target ycsb -j2
            echo "Container disk usage after YCSB build:"
            df -h / /workspace /tmp
            echo "YCSB build output size:"
            du -sh /workspace/build_ycsb_recstore /workspace/build_ycsb_external 2>/dev/null || true
          '

      - name: Run YCSB scenario matrix
        run: |
          set -euo pipefail
          docker exec \
            -e OUTPUT_DIR="${OUTPUT_DIR}" \
            -e YCSB_RECORD_COUNT="${YCSB_RECORD_COUNT}" \
            -e YCSB_OPERATION_COUNT="${YCSB_OPERATION_COUNT}" \
            -e YCSB_HYBRIDKV_SHM_CAPACITY="${YCSB_HYBRIDKV_SHM_CAPACITY}" \
            -e YCSB_HYBRIDKV_SSD_CAPACITY="${YCSB_HYBRIDKV_SSD_CAPACITY}" \
            "${TEST_CONTAINER}" bash -lc '
            set -euo pipefail
            cd /workspace
            rm -rf "${OUTPUT_DIR}"
            python3 tools/benchmarks/run_ycsb_compare.py \
              --build-dir build_ycsb_recstore \
              --engines kvdb cceh basic rocksdb leveldb sqlite \
              --workloads workloada workloadc workload-update \
              --record-count "${YCSB_RECORD_COUNT}" \
              --operation-count "${YCSB_OPERATION_COUNT}" \
              --threads 1 \
              --repeat 1 \
              --engine-prop "kvdb:hybridkv.shmcapacity=${YCSB_HYBRIDKV_SHM_CAPACITY}" \
              --engine-prop "kvdb:hybridkv.ssdcapacity=${YCSB_HYBRIDKV_SSD_CAPACITY}" \
              --engine-ycsb-bin "rocksdb:/workspace/build_ycsb_external/bin/ycsb" \
              --engine-ycsb-bin "leveldb:/workspace/build_ycsb_external/bin/ycsb" \
              --engine-ycsb-bin "sqlite:/workspace/build_ycsb_external/bin/ycsb" \
              --output-dir "${OUTPUT_DIR}"
            python3 tools/benchmarks/run_ycsb_compare.py \
              --build-dir build_ycsb_recstore \
              --engines kvdb_batch cceh_batch \
              --workloads workloadc \
              --record-count "${YCSB_RECORD_COUNT}" \
              --operation-count "${YCSB_OPERATION_COUNT}" \
              --batch-size 128 \
              --threads 1 \
              --repeat 1 \
              --engine-prop "kvdb_batch:hybridkv.shmcapacity=${YCSB_HYBRIDKV_SHM_CAPACITY}" \
              --engine-prop "kvdb_batch:hybridkv.ssdcapacity=${YCSB_HYBRIDKV_SSD_CAPACITY}" \
              --output-dir "${OUTPUT_DIR}" \
              --append-summary
            python3 tools/benchmarks/run_ycsb_compare.py \
              --build-dir build_ycsb_recstore \
              --engines kvdb_embedding cceh_embedding rocksdb_embedding leveldb_embedding sqlite_embedding \
              --workloads workloada workloadc workload-update \
              --record-count "${YCSB_RECORD_COUNT}" \
              --operation-count "${YCSB_OPERATION_COUNT}" \
              --threads 1 \
              --repeat 1 \
              --engine-prop "kvdb_embedding:hybridkv.shmcapacity=${YCSB_HYBRIDKV_SHM_CAPACITY}" \
              --engine-prop "kvdb_embedding:hybridkv.ssdcapacity=${YCSB_HYBRIDKV_SSD_CAPACITY}" \
              --engine-ycsb-bin "rocksdb_embedding:/workspace/build_ycsb_external/bin/ycsb" \
              --engine-ycsb-bin "leveldb_embedding:/workspace/build_ycsb_external/bin/ycsb" \
              --engine-ycsb-bin "sqlite_embedding:/workspace/build_ycsb_external/bin/ycsb" \
              --output-dir "${OUTPUT_DIR}" \
              --append-summary
            echo "Container disk usage after YCSB run:"
            df -h / /workspace /tmp
            echo "YCSB output size after run:"
            du -sh "${OUTPUT_DIR}" "${OUTPUT_DIR}/logs" "${OUTPUT_DIR}/data" 2>/dev/null || true
            rm -rf "${OUTPUT_DIR}/data" /workspace/build_ycsb_recstore /workspace/build_ycsb_external /workspace/third_party
            echo "Container disk usage after YCSB cleanup:"
            df -h / /workspace /tmp
          '

      - name: Collect YCSB artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ycsb-artifacts
          docker cp "${TEST_CONTAINER}:${OUTPUT_DIR}/." ycsb-artifacts/ || true
          echo "Collected YCSB artifact size:"
          du -sh ycsb-artifacts 2>/dev/null || true
          echo "Host disk usage after collecting YCSB artifacts:"
          df -h "${GITHUB_WORKSPACE}" /tmp
          docker rm -f "${TEST_CONTAINER}" || true
          echo "Docker disk usage after removing YCSB container:"
          docker system df

      - name: Upload YCSB artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ycsb-scenario-results
          path: ycsb-artifacts/
          if-no-files-found: error

      - name: Download existing YCSB history
        if: env.PUBLISH_YCSB == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/ycsb-existing
          git fetch origin gh-pages --depth=1
          mkdir -p /tmp/ycsb-existing/ycsb
          git show FETCH_HEAD:ycsb/history.jsonl > /tmp/ycsb-existing/ycsb/history.jsonl 2>/dev/null || true

      - name: Render YCSB Pages
        if: env.PUBLISH_YCSB == 'true'
        run: |
          set -euo pipefail
          python3 ci/benchmark/render_ycsb_pages.py \
            --summary-csv ycsb-artifacts/summary.csv \
            --output-dir ycsb-pages \
            --existing-history /tmp/ycsb-existing/ycsb/history.jsonl \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --branch "${{ github.event.workflow_run.head_branch }}" \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --record-count "${YCSB_RECORD_COUNT}" \
            --operation-count "${YCSB_OPERATION_COUNT}" \
            --threads 1

      - name: Publish YCSB Pages
        if: env.PUBLISH_YCSB == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          bash ci/pages/update_gh_pages.sh \
            --source ycsb-pages \
            --mode ycsb \
            --message "ci: deploy ycsb reports"

name: CI Failure Notifications

on:
  workflow_run:
    workflows: [Format, Docker Test]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: ci-notifications-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.name == 'Docker Test' && 'tracker' || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion) &&
      (github.event.workflow_run.name == 'Format' ||
       (github.repository == 'RecStore/RecStore' &&
        github.event.workflow_run.head_repository.full_name == 'RecStore/RecStore' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.event != 'pull_request_target'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Only execute the trusted workflow revision, never the failed PR's code.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/ci

      - name: Download failed Docker Test logs
        id: logs
        if: github.event.workflow_run.name == 'Docker Test'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/docker-test-workflow-logs.zip" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/attempts/${FAILED_RUN_ATTEMPT}/logs"

      - name: Attach Docker Test logs
        id: log-artifact
        if: steps.logs.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-logs-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/docker-test-workflow-logs.zip
          compression-level: 0
          if-no-files-found: error

      - uses: actions/github-script@v7
        env:
          DOCKER_LOGS_URL: ${{ steps.log-artifact.outputs.artifact-url }}
        with:
          script: |
            const { notifyFailure } = require('./.github/scripts/ci/notifications.js');
            await notifyFailure(github, context, process.env.DOCKER_LOGS_URL);

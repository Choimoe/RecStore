name: Docker Publish

on:
  push:
    paths:
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Existing image tag to reuse"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Retag and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Preflight publish checks
        id: preflight
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SOURCE_TAG: ${{ inputs.source_tag || '' }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "GITHUB_TOKEN is empty; cannot publish to GHCR" >&2
            exit 1
          fi

          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}/recstore-devel"
          if ! echo "${IMAGE_REPO}" | grep -Eq '^[a-z0-9._/-]+$'; then
            echo "Computed image repository is invalid: ${IMAGE_REPO}" >&2
            exit 1
          fi

          SOURCE_TAG="latest"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_SOURCE_TAG}" ]; then
            SOURCE_TAG="${INPUT_SOURCE_TAG}"
          fi

          echo "image_repo=${IMAGE_REPO}" >> "${GITHUB_OUTPUT}"
          echo "source_tag=${SOURCE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Preflight summary:"
          echo "  - Actor: ${GITHUB_ACTOR}"
          echo "  - Repository: ${GITHUB_REPOSITORY}"
          echo "  - Event: ${GITHUB_EVENT_NAME}"
          echo "  - Image repo: ${IMAGE_REPO}"
          echo "  - Source tag: ${SOURCE_TAG}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "  - Manual run: true"
          fi

          echo "::notice::If publish fails with permission denied, verify repository Actions permission is set to Read and write permissions."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull source image
        env:
          IMAGE_REPO: ${{ steps.preflight.outputs.image_repo }}
          SOURCE_TAG: ${{ steps.preflight.outputs.source_tag }}
        run: |
          set -euo pipefail
          SOURCE_IMAGE="${IMAGE_REPO}:${SOURCE_TAG}"
          echo "Pulling source image: ${SOURCE_IMAGE}"
          docker pull "${SOURCE_IMAGE}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.preflight.outputs.image_repo }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Push final image tags
        env:
          IMAGE_REPO: ${{ steps.preflight.outputs.image_repo }}
          SOURCE_TAG: ${{ steps.preflight.outputs.source_tag }}
        run: |
          set -euo pipefail
          SOURCE_IMAGE="${IMAGE_REPO}:${SOURCE_TAG}"
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then
              docker tag "${SOURCE_IMAGE}" "${tag}"
              docker push "${tag}"
            fi
          done << 'EOF'
          ${{ steps.meta.outputs.tags }}
          EOF

name: Format

on:
  pull_request:
    paths:
      - 'src/**/*.cc'
      - 'src/**/*.cpp'
      - 'src/**/*.h'
      - '.clang-format'
      - '.githooks/pre-commit'
      - 'tools/format/clang_format.sh'
      - '.github/workflows/format.yml'
  push:
    paths:
      - 'src/**/*.cc'
      - 'src/**/*.cpp'
      - 'src/**/*.h'
      - '.clang-format'
      - '.githooks/pre-commit'
      - 'tools/format/clang_format.sh'
      - '.github/workflows/format.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    name: Run clang-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install clang-format
        run: |
          set -euo pipefail
          sudo apt-get update
          # Pin the clang-format major version so the check does not drift when
          # the runner image changes. The tracked sources are formatted with
          # clang-format 18.
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        env:
          CLANG_FORMAT: clang-format-18
          FORMAT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: tools/format/clang_format.sh --check --changed

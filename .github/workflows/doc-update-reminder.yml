name: Documentation Update

on:
  pull_request_target:
    paths:
      - 'src/**'
      - 'model_zoo/**'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          # pull_request_target runs with the base repository's token and secrets,
          # so this workflow must not check out or execute fork code (pwn-request
          # risk). Only the trusted base branch is checked out; the PR head is
          # fetched as git objects below and never run.
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Get changed files
        id: changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pr-head"

          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}" "${HEAD_SHA}")

          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Check documentation
        id: check
        run: |
          python3 tools/docs/check_updated_docs.py "${{ steps.changes.outputs.files }}" > /tmp/comment.txt 2>&1
          if [ -s /tmp/comment.txt ] && [ $? -eq 0 ]; then
            cat /tmp/comment.txt
            echo "has_comment=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Comment PR
        if: steps.check.outputs.has_comment == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('/tmp/comment.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
